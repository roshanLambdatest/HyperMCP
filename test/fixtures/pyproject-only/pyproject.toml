[project]
name = "acme-e2e"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["selenium>=4.20"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-xdist>=3.5", "pytest-html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"
markers = ["smoke: quick checks"]
