---
# HyperExecute YAML generated for: nunit-selenium-hyperexecute-sample
# Framework: nunit | Language: csharp | Build: dotnet
# YAML 0.2 | Mode: autosplit (native discovery) | Split by: class
# Run: ./hyperexecute --user "$LT_USERNAME" --key "$LT_ACCESS_KEY" --config hyperexecute.yaml

version: "0.2"
globalTimeout: 90
testSuiteTimeout: 90
testSuiteStep: 90
runson: linux
autosplit: true
retryOnFailure: true
maxRetries: 1
concurrency: 2
idleTimeout: 900
runtime:
  language: dotnet
  version: "8.0"
env:
  LT_USERNAME: ${{ .secrets.LT_USERNAME }}
  LT_ACCESS_KEY: ${{ .secrets.LT_ACCESS_KEY }}
  DISABLE_FIREFOX: "true"
pre:
  - dotnet restore NUnitHyperTestDemo.sln
  - dotnet build NUnitHyperTestDemo.sln -c Release --no-restore
post:
  - ls -la
framework:
  name: dotnet/nunit
  discoveryMode: remote
  discoveryType: class
mergeArtifacts: true
uploadArtefacts:
  - name: TestResults
    path:
      - TestResults/**
jobLabel:
  - nunit
  - linux
  - v0.2
