---
# HyperExecute YAML generated for: hyperexecute-java-playwright-sample
# Framework: junit5 | Language: java | Build: maven
# YAML 0.1 | Mode: autosplit | Split by: class
# Run: ./hyperexecute --user "$LT_USERNAME" --key "$LT_ACCESS_KEY" --config hyperexecute.yaml

version: 0.1
globalTimeout: 90
testSuiteTimeout: 90
testSuiteStep: 90
runson: linux
autosplit: true
retryOnFailure: true
maxRetries: 1
concurrency: 2
runtime:
  language: java
  version: "21"
env:
  CACHE_DIR: m2_cache_dir
  LT_USERNAME: ${{ .secrets.LT_USERNAME }}
  LT_ACCESS_KEY: ${{ .secrets.LT_ACCESS_KEY }}
cacheKey: '{{ checksum "pom.xml" }}'
cacheDirectories:
  - $CACHE_DIR
pre:
  - npm install playwright@1.57.0 --save-exact
  - mvn -Dmaven.repo.local=$CACHE_DIR -DskipTests clean test-compile
post:
  - ls -la
testDiscovery:
  type: raw
  mode: remote
  command: grep -rlE --include='*.java' '@(Test|ParameterizedTest)([^A-Za-z]|$)' src/test/java | sed -E 's#^.*src/test/(java|groovy)/##; s#\.(java|groovy)$##; s#/#.#g'
testRunnerCommand: mvn test -Dmaven.repo.local=$CACHE_DIR -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false -Dtest="$test"
mergeArtifacts: true
uploadArtefacts:
  - name: Reports
    path:
      - target/surefire-reports/**
report: true
partialReports:
  location: target/surefire-reports/
  type: xml
  frameworkName: junit
jobLabel:
  - junit5
  - linux
  - autosplit
