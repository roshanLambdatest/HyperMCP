---
# HyperExecute YAML generated for: behave-selenium-hyperexecute-sample
# Framework: behave | Language: python | Build: -
# YAML 0.1 | Mode: autosplit | Split by: feature
# Run: ./hyperexecute --user "$LT_USERNAME" --key "$LT_ACCESS_KEY" --config hyperexecute.yaml

version: 0.1
globalTimeout: 90
testSuiteTimeout: 90
testSuiteStep: 90
runson: linux
autosplit: true
retryOnFailure: true
maxRetries: 1
concurrency: 2
runtime:
  language: python
  version: "3.11"
env:
  LT_USERNAME: ${{ .secrets.LT_USERNAME }}
  LT_ACCESS_KEY: ${{ .secrets.LT_ACCESS_KEY }}
  TARGET_OS: Windows 10
cacheKey: '{{ checksum "requirements.txt" }}'
cacheDirectories:
  - pip_cache
pre:
  - pip3 install -r requirements.txt --cache-dir pip_cache
post:
  - ls -la
testDiscovery:
  type: raw
  mode: remote
  command: find features -type f -name '*.feature'
testRunnerCommand: python3 -m behave "$test" -f json.pretty -o reports/behave-$RANDOM.json -f pretty
mergeArtifacts: true
uploadArtefacts:
  - name: Reports
    path:
      - reports/**
jobLabel:
  - behave
  - linux
  - autosplit
