---
# HyperExecute YAML generated for: karatelabs_karate-template
# Framework: karate | Language: java | Build: maven
# YAML 0.1 | Mode: autosplit | Split by: feature
# Run: ./hyperexecute --user "$LT_USERNAME" --key "$LT_ACCESS_KEY" --config hyperexecute.yaml

version: 0.1
globalTimeout: 90
testSuiteTimeout: 90
testSuiteStep: 90
runson: linux
autosplit: true
retryOnFailure: true
maxRetries: 1
concurrency: 2
scenarioCommandStatusOnly: true
runtime:
  language: java
  version: "17"
env:
  CACHE_DIR: m2_cache_dir
  LT_USERNAME: ${{ .secrets.LT_USERNAME }}
  LT_ACCESS_KEY: ${{ .secrets.LT_ACCESS_KEY }}
cacheKey: '{{ checksum "pom.xml" }}'
cacheDirectories:
  - $CACHE_DIR
pre:
  - mvn -Dmaven.repo.local=$CACHE_DIR -DskipTests clean test-compile
post:
  - ls -la
testDiscovery:
  type: raw
  mode: remote
  command: find src/test/java/examples/users -type f -name '*.feature' | sed -E 's#^.*src/test/(java|resources)/##'
testRunnerCommand: mvn test -Dmaven.repo.local=$CACHE_DIR -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false -Dtest=ExamplesTest -Dkarate.options="classpath:$test"
mergeArtifacts: true
uploadArtefacts:
  - name: KarateReports
    path:
      - target/karate-reports/**
jobLabel:
  - karate
  - linux
  - autosplit
