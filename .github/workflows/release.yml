# Push a tag like v1.2.0 → tests run, the .vsix is built and attached to a GitHub Release.
name: Release VS Code extension

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            vscode-extension/package-lock.json

      - name: Test MCP core
        run: npm ci && npm test

      - name: Check tag matches extension version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(node -p "require('./vscode-extension/package.json').version")
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match vscode-extension/package.json version $v"; exit 1
          fi

      - name: Build .vsix
        working-directory: vscode-extension
        run: npm ci && npm run package

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" vscode-extension/hyperexecute-studio.vsix \
            --title "HyperExecute Studio $GITHUB_REF_NAME" \
            --notes "Install: download hyperexecute-studio.vsix below → VS Code Extensions view → ⋯ → Install from VSIX… → then run Developer: Reload Window." \
            --generate-notes

      - name: Upload build artifact (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: hyperexecute-studio
          path: vscode-extension/hyperexecute-studio.vsix
