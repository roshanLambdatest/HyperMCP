# Playwright projects spread over VMs with a matrix axis.
#
# Pitfalls:
# - $project is substituted per task, one browser project per VM.
#
# Built by the MCP generator from test/fixtures/playwright-projects; replace with a YAML verified on HyperExecute when you have one.
version: 0.1
globalTimeout: 90
testSuiteTimeout: 90
testSuiteStep: 90
runson: linux
retryOnFailure: true
maxRetries: 1
concurrency: 5
runtime:
  language: node
  version: "20"
env:
  TEST_ENV: staging
  LT_USERNAME: ${{ .secrets.LT_USERNAME }}
  LT_ACCESS_KEY: ${{ .secrets.LT_ACCESS_KEY }}
  BASE_URL: <set BASE_URL>
cacheKey: '{{ checksum "package.json" }}'
cacheDirectories:
  - node_modules
pre:
  - npm install
  - npx playwright install --with-deps
post:
  - ls -la
matrix:
  test:
    - e2e/specs/login.spec.ts
    - e2e/specs/profile.spec.ts
  project:
    - chromium
    - firefox
    - webkit
testSuites:
  - npx playwright test --config=e2e/pw.config.ts --project="$project" "$test"
mergeArtifacts: true
uploadArtefacts:
  - name: PlaywrightReport
    path:
      - playwright-report/**
      - test-results/**
jobLabel:
  - playwright
  - linux
  - matrix
