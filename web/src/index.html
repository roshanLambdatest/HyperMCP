<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HyperExecute Studio</title>
<meta name="description" content="Build, check and fix a HyperExecute YAML from your test repo. Runs entirely in your browser; your code is never uploaded.">
<!-- The page may only talk to LambdaTest's API (live browser lists, optional account check) GitHub (only when the visitor imports a public repo by URL) and, if the visitor turns Claude on with their own key, Anthropic's API. Repo files never leave the tab. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://api.lambdatest.com https://api.anthropic.com https://api.github.com https://raw.githubusercontent.com; font-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css?v=__V__">
</head>
<body>
<div id="app"></div>
<noscript>HyperExecute Studio needs JavaScript. Everything runs in this page; nothing is uploaded.</noscript>
<script type="module" src="app.js?v=__V__"></script>
</body>
</html>
