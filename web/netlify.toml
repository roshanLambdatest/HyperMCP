# Netlify: static site, no server code. Base directory "web" (set in the Netlify UI, or deploy this folder).
[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Security headers on every page. The Content-Security-Policy itself is in index.html; frame-ancestors
# can only be set as a header, so it lives here: the page can't be embedded in another site.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# The page always checks for a new version; scripts and styles are versioned (?v=) so they can be cached.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
